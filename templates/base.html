<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BLOCKSHADE{% endblock %}</title>
    <!-- Tailwind CSS v4 browser build (local copy for offline use, from @tailwindcss/browser@4.3.3) -->
    <script src="/static/tailwind.browser.js"></script>
    <!-- Anduril design system: dark canvas, lime accent, flat, square corners -->
    <!-- Chinese font: 字魂凹凸世界体 (商用授权) -->
    <style>
        @font-face {
            font-family: 'ZiHunAoTu';
            src: url('/static/fonts/ZiHunAoTuShiJieTi.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            /* Anduril tokens */
            --canvas: #010101;
            --ink: #ffffff;
            --ink-soft: #8e9291;
            --hairline: #6c6e6b;
            --lime: #dff140;
            --cloud: #505544;

            /* Backwards-compatible aliases — existing var() refs across all templates follow these */
            --bg-dark: var(--canvas);
            --bg-sidebar: var(--canvas);
            --bg-card: var(--canvas);
            --bg-card-inner: var(--canvas);
            --accent-green: var(--lime);
            --accent-green-dim: rgba(108, 110, 107, 0.3);
            --text-light: var(--ink);
            --text-muted: var(--ink-soft);
            --link-color: var(--ink);
            --keyword-color: var(--ink);

            /* Semantic alert colors — functional risk grading, retained */
            --alert-red: #E86E6E;
            --alert-yellow: #E8D86E;
            --alert-green: #6EE86E;

            --font-chinese: 'ZiHunAoTu', sans-serif;
            --font-sans: 'HelveticaNowDisplay', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: Monaco, "Bitstream Vera Sans Mono", "Lucida Console", Terminal, monospace;
            --font-size-base: 18px;
        }

        /* Anduril hard rules: flat (no shadow) + square corners (no radius) everywhere.
           These override Tailwind rounded-* utilities and inline dashed borders on every page. */
        * {
            border-radius: 0 !important;
            box-shadow: none !important;
            font-size: inherit;
        }
        [style*="dashed"] {
            border-style: solid !important;
        }
        /* Spinner is a motion element, not a UI container — keep it round. */
        .animate-spin {
            border-radius: 50% !important;
        }

        body {
            font-family: var(--font-sans);
            background: var(--canvas);
            color: var(--ink);
            font-size: var(--font-size-base);
            line-height: 1.6;
        }

        a { cursor: pointer; transition: color 0.2s ease-out; }
        a:hover { color: var(--lime); }

        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.25rem; }
        h3 { font-size: 1.1rem; }
        .text-lg { font-size: 1.25rem; }
        .text-xl { font-size: 1.5rem; }
        .text-2xl { font-size: 1.75rem; }
        .text-3xl { font-size: 2rem; }
        .text-sm { font-size: 0.9rem; }
        .text-xs { font-size: 0.8rem; }

        /* Address styling - wider letter spacing for readability */
        .address-text, .font-mono.address-text, [data-address], .address-display {
            letter-spacing: 0.15em;
            font-weight: 500;
            overflow-x: auto;
            white-space: nowrap;
            max-width: 100%;
            scrollbar-width: thin;
        }

        /* Force full address display with horizontal scroll */
        .address-full {
            letter-spacing: 0.12em;
            white-space: nowrap;
            overflow-x: auto;
            text-overflow: clip;
            max-width: 100%;
            display: inline-block;
        }

        /* Secondary text stays readable on the dark canvas */
        .text-gray-400, .text-gray-500, .text-gray-600 {
            color: var(--ink) !important;
        }

        /* Terminal/code elements use monospace */
        .terminal-header, input, textarea, select, code, pre, .font-mono {
            font-family: var(--font-mono);
        }

        .sidebar {
            background: var(--canvas);
            border-right: 1px solid var(--hairline);
            width: 280px;
        }

        .brand-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--hairline);
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            overflow: hidden;
            border: 1px solid var(--hairline);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Chinese brand title keeps its display font */
        .terminal-title {
            font-family: var(--font-chinese);
            color: var(--ink);
            font-weight: bold;
            font-size: 1.3rem;
        }

        /* English subtitle: Times New Roman decorative label */
        .terminal-subtitle {
            font-family: 'Times New Roman', serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ink-soft);
            font-size: 1rem;
        }

        /* Navigation section divider */
        .nav-section-title {
            color: var(--ink-soft);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 16px;
            margin-top: 16px;
            border-top: 1px solid var(--hairline);
        }

        .nav-section-title:first-of-type {
            border-top: none;
            margin-top: 0;
        }

        /* Nav links styling */
        .nav-link {
            display: block;
            padding: 10px 16px;
            color: var(--ink-soft);
            transition: color 0.2s ease-out;
            position: relative;
            font-size: 1rem;
            cursor: pointer;
        }

        .nav-link::before {
            content: ">> ";
            color: var(--lime);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            color: var(--lime);
        }

        .nav-link:hover::before {
            opacity: 1;
        }

        .nav-link.active {
            color: var(--lime);
            border-left: 2px solid var(--lime);
        }

        .nav-link.active::before {
            opacity: 1;
        }

        .card {
            background: var(--canvas);
            border: 1px solid var(--hairline);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s ease-out;
            animation: cardFadeIn 0.4s ease-out;
        }

        .card:hover {
            border-color: var(--lime);
        }

        .card-inner {
            background: var(--canvas);
            border: 1px solid var(--hairline);
            padding: 0.75rem;
            transition: border-color 0.2s ease-out;
        }

        .card-inner:hover {
            border-color: var(--lime);
        }

        /* Grid containers */
        .grid {
            border-collapse: separate;
            border-spacing: 0.5rem;
        }

        .grid > div {
            border: 1px solid var(--hairline);
            padding: 0.75rem;
            background: var(--canvas);
        }

        /* Form grid */
        .grid-cols-2 > div, .grid-cols-3 > div, .grid-cols-4 > div {
            border: 1px solid var(--hairline);
            background: var(--canvas);
            padding: 0.75rem;
        }

        /* Primary button: transparent base + lime border; fills lime on hover */
        .btn-primary {
            background: transparent;
            color: var(--lime);
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid var(--lime);
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-primary:hover {
            background: var(--lime);
            color: var(--canvas);
        }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--hairline);
            font-size: 1rem;
            padding: 10px 20px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--lime);
            color: var(--lime);
        }

        .footer-dark {
            background: var(--canvas);
            border-top: 1px solid var(--hairline);
            color: var(--ink-soft);
            font-size: 1rem;
            padding: 1rem;
        }

        /* Terminal-style headers */
        .terminal-header {
            color: var(--ink-soft);
            font-weight: bold;
            font-size: 1.25rem;
        }

        .terminal-header::before {
            content: "$ ./";
        }

        /* Input styling */
        input[type="text"], textarea, select {
            background: var(--canvas);
            color: var(--ink);
            border: 1px solid var(--hairline);
            padding: 10px 14px;
            font-family: var(--font-mono);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--lime);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--canvas);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--hairline);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--lime);
        }

        /* Alert sections — semantic risk colors retained */
        .alert-red {
            background: rgba(232, 110, 110, 0.12);
            border: 1px solid var(--alert-red);
            border-left: 6px solid var(--alert-red);
        }

        .alert-yellow {
            background: rgba(232, 216, 110, 0.12);
            border: 1px solid var(--alert-yellow);
            border-left: 6px solid var(--alert-yellow);
        }

        .alert-green {
            background: rgba(110, 232, 110, 0.12);
            border: 1px solid var(--alert-green);
            border-left: 6px solid var(--alert-green);
        }

        /* Smooth page transitions (opacity only, per Anduril motion rules) */
        main {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes cardFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="flex min-h-screen">
    <!-- Sidebar navigation -->
    {% block sidebar %}
    <aside class="sidebar fixed h-full overflow-y-auto" style="width: 280px;">
        <!-- Brand header -->
        <div class="brand-header">
            <div class="flex items-center space-x-3">
                <div class="brand-logo"><img src="/static/logo.png" alt="Logo"></div>
                <div>
                    <h1 class="terminal-title">区块猎影</h1>
                    <p class="terminal-subtitle">BLOCKSHADE</p>
                </div>
            </div>
        </div>

        <!-- Navigation menu -->
        <nav class="p-2">
            <a href="/" class="nav-link{% if request.path == '/' %} active{% endif %}">
                <span class="flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    首页
                </span>
            </a>

            <p class="nav-section-title">地址分析</p>

            <a href="/tron/suspicious-analyzer" class="nav-link{% if request.path == '/tron/suspicious-analyzer' %} active{% endif %}">TRON可疑分析</a>
            <a href="/tron/behavior-analyzer" class="nav-link{% if request.path == '/tron/behavior-analyzer' %} active{% endif %}">TRON行为分析</a>
            <a href="/eth/transaction-query" class="nav-link{% if request.path == '/eth/transaction-query' %} active{% endif %}">ETH交易查询</a>

            <p class="nav-section-title">交易追踪</p>

            <a href="/trace/uniswap" class="nav-link{% if request.path == '/trace/uniswap' %} active{% endif %}">Uniswap追踪</a>
            <a href="/trace/mixer" class="nav-link{% if request.path == '/trace/mixer' %} active{% endif %}">混币器追踪</a>
            <a href="/trace/btc" class="nav-link{% if request.path == '/trace/btc' %} active{% endif %}">BTC交易分析</a>

            <p class="nav-section-title">跨链分析</p>

            <a href="/cross/cluster" class="nav-link{% if request.path == '/cross/cluster' %} active{% endif %}">地址聚类</a>
            <a href="/cross/cross-border" class="nav-link{% if request.path == '/cross/cross-border' %} active{% endif %}">跨境协查</a>

            <p class="nav-section-title">案件处理</p>

            <a href="/case/monitor" class="nav-link{% if request.path == '/case/monitor' %} active{% endif %}">多链监控</a>
            <a href="/case/obfuscation" class="nav-link{% if request.path == '/case/obfuscation' %} active{% endif %}">混淆对抗</a>
            <a href="/case/asset-freeze" class="nav-link{% if request.path == '/case/asset-freeze' %} active{% endif %}">资产追回</a>

            <p class="nav-section-title">文档</p>

            <a href="/docs/manuals" class="nav-link{% if request.path == '/docs/manuals' %} active{% endif %}">使用手册</a>
            <a href="/docs/api-guide" class="nav-link{% if request.path == '/docs/api-guide' %} active{% endif %}">API获取指南</a>
        </nav>
    </aside>
    {% endblock %}

    <!-- Main content area - adjusted for wider sidebar -->
    <main class="flex-1 p-6 min-h-screen" style="margin-left: 280px;">
        {% block content %}{% endblock %}
    </main>

    <!-- Legal disclaimer footer - adjusted for wider sidebar -->
    {% block footer %}
    <footer class="footer-dark fixed bottom-0 p-3 text-center" style="left: 280px; right: 0;">
        <span style="color: var(--alert-yellow);">⚠</span> 法律声明：本工具仅供合规调查使用，请确保遵守相关法律法规。所有分析结果仅供参考，不构成法律证据。
    </footer>
    {% endblock %}
</body>
</html>
